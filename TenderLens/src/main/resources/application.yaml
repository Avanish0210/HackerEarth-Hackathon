server:
  port: 8081
  servlet:
    context-path: /api/tenderlens

spring:
  application:
    name: TenderLens

  # ── PostgreSQL ────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/hackathon_db
    username: postgres
    password: avanish7080
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: tenderlens   # TenderLens uses its own schema
    open-in-view: false

  # ── Redis ─────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ── Kafka ─────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: tenderlens-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hackerearth.hackathon.tenderlens.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      properties:
        enable.idempotence: true
        acks: all
    listener:
      ack-mode: MANUAL_IMMEDIATE

  # ── Spring AI — Ollama ────────────────────────────────────────
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.1          # low temp for deterministic structured extraction
          top-p: 0.9
          num-ctx: 8192             # large context for long tender documents

  # ── File Upload ───────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# ── TenderLens custom config ───────────────────────────────────
tenderlens:
  # Idempotency TTL in Redis (seconds) — 24 hours
  idempotency-ttl-seconds: 86400

  llm:
    # Confidence threshold below which verdict goes to Human Review Queue
    confidence-threshold: 0.75
    # Max retries if LLM returns malformed JSON
    max-parse-retries: 3

  ocr:
    # Tesseract data path inside Docker container
    tessdata-path: /usr/share/tesseract-ocr/5/tessdata
    language: eng
    # DPI for image rendering before OCR
    dpi: 300

  evaluation:
    # How many bidder docs can be processed in parallel
    parallel-bidder-threads: 4
    # Kafka topic for async evaluation jobs
    topic: tenderlens-evaluation-jobs

  report:
    # Output directory for generated PDF reports inside container
    output-dir: /tmp/tenderlens/reports

  # Kafka topics
  topics:
    evaluation-jobs: tenderlens-evaluation-jobs
    review-queue: tenderlens-review-queue
    audit-events: tenderlens-audit-events

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.hackerearth.hackathon.tenderlens: DEBUG
    org.springframework.ai: DEBUG      # useful to see LLM prompts during dev
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
